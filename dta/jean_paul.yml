description: |
  Das Korpus „Jean Paul – Sämtliche Briefe“ umfasst 9.678 Briefe, die der
  Schriftsteller Jean Paul (Jean Paul Friedrich Richter, 1763–1825)
  verfasste, an ihn gerichte Briefe sowie Briefe aus seinem Umfeld. Die
  Texte dokumentieren die Korrespondenz des Autors mit bekannten
  Persönlichkeiten wie Heinrich Jacobi, Caroline und Johann Gottfried
  Herder, Charlotte von Kalb und Johann Wilhelm Ludwig Gleim, der
  preußischen Königin Luise und Rahel Levin Varnhagen sowie mit Familie
  und Freund/innen. Das Korpus entstammt der Edition „Jean Paul – Sämtliche Briefe
  digital“.
